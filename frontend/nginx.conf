server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A brief runs several corpus searches plus up to WEB_SEARCH_MAX_USES
        # web searches before the model emits anything, so a run routinely
        # outlives nginx's 60s default. Without this the proxy cuts the
        # connection mid-generation and the browser sees a bare 504 -- while
        # the same request against :8000 succeeds.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # The brief endpoints stream Server-Sent Events. nginx buffers proxied
        # responses by default, which would hold the entire activity feed until
        # the run finished -- the feature would look fine against :8000 in
        # development and silently do nothing through here.
        proxy_buffering off;
        proxy_cache off;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
